name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run pytest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: sqlite:///./test.db
          FAISS_INDEX_PATH: ./app/data/faiss_index
          DOCUMENTS_PATH: ./app/data/clinical_docs
          CRISIS_KEYWORDS: suicide,self-harm,kill myself,end my life,hurt myself,overdose
        run: |
          cd backend
          python -m pytest ../tests/ -v --tb=short

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Verify build output
        run: |
          ls frontend/dist
          echo "Frontend build successful"

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test env file
        run: |
          echo "OPENAI_API_KEY=sk-test-key" > backend/.env
          echo "DATABASE_URL=sqlite:///./mental_health.db" >> backend/.env
          echo "ENVIRONMENT=production" >> backend/.env
          echo "APP_NAME=Mental Health AI Assistant" >> backend/.env
          echo "APP_VERSION=1.0.0" >> backend/.env
          echo "FAISS_INDEX_PATH=./app/data/faiss_index" >> backend/.env
          echo "DOCUMENTS_PATH=./app/data/clinical_docs" >> backend/.env
          echo "MAX_TOKENS=1000" >> backend/.env
          echo "TEMPERATURE=0.1" >> backend/.env
          echo "MODEL_NAME=gpt-4o" >> backend/.env
          echo "EMBEDDING_MODEL=text-embedding-3-small" >> backend/.env
          echo "TOP_K_RESULTS=5" >> backend/.env
          echo "CRISIS_KEYWORDS=suicide,self-harm,kill myself" >> backend/.env

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t mental-health-backend .

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend -t mental-health-frontend .

      - name: Confirm both images built
        run: |
          docker images | grep mental-health
          echo "Both Docker images built successfully"

  deploy-aws:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create backend .env for build
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > backend/.env
          echo "DATABASE_URL=sqlite:///./mental_health.db" >> backend/.env
          echo "ENVIRONMENT=production" >> backend/.env
          echo "APP_NAME=Mental Health AI Assistant" >> backend/.env
          echo "APP_VERSION=1.0.0" >> backend/.env
          echo "FAISS_INDEX_PATH=./app/data/faiss_index" >> backend/.env
          echo "DOCUMENTS_PATH=./app/data/clinical_docs" >> backend/.env
          echo "MAX_TOKENS=1000" >> backend/.env
          echo "TEMPERATURE=0.1" >> backend/.env
          echo "MODEL_NAME=gpt-4o" >> backend/.env
          echo "EMBEDDING_MODEL=text-embedding-3-small" >> backend/.env
          echo "TOP_K_RESULTS=5" >> backend/.env
          echo "CRISIS_KEYWORDS=suicide,self-harm,kill myself,end my life,hurt myself,overdose" >> backend/.env

      - name: Build and push backend image to ECR
        run: |
          docker build -f Dockerfile.backend \
            -t ${{ secrets.ECR_BACKEND_URI }}:latest \
            -t ${{ secrets.ECR_BACKEND_URI }}:${{ github.sha }} .
          docker push ${{ secrets.ECR_BACKEND_URI }}:latest
          docker push ${{ secrets.ECR_BACKEND_URI }}:${{ github.sha }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster mental-health-ai-cluster \
            --service mental-health-ai-backend-service \
            --force-new-deployment \
            --region us-east-1
        continue-on-error: true

      - name: Build and deploy frontend to S3
        run: |
          cd frontend
          npm ci
          npm run build
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} --delete
        continue-on-error: true

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
        continue-on-error: true

      - name: Deployment complete
        run: |
          echo "Deployment to AWS completed"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date)"
